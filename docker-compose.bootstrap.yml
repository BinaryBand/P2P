version: "3.8"

services:
  p2p-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2p-bootstrap-node
    restart: always
    ports:
      - "4001:4001"
      - "8080:8080"
    volumes:
      - bootstrap-storage:/app/storage
      - bootstrap-logs:/app/logs
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - BOOTSTRAP_MODE=true
      - SEED_PASSWORD=${BOOTSTRAP_SEED_PASSWORD:-bootstrap-default-seed}
    networks:
      - p2p-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  bootstrap-storage:
    driver: local
  bootstrap-logs:
    driver: local

networks:
  p2p-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
